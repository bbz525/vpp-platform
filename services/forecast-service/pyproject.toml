[project]
name = "vpp-forecast-service"
version = "0.1.0"
description = "Forecast service skeleton for the VPP platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpp_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
